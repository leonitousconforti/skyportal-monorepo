[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "skyportal-py-models"
version = "0.4.0"
description = "Pydantic request and response models for the SkyPortal API"
readme = "README.md"
authors = [{ name = "Leo Conforti", email = "leo@leoconforti.us" }]
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["pydantic>=2"]
requires-python = ">=3.11"

[project.urls]
source = "https://github.com/skyportal/skyportal-monorepo"

[tool.uv.build-backend]
module-name = "skyportal_py_models"
module-root = ""
