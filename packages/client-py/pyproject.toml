[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[project]
name = "skyportal-py"
version = "0.4.0"
description = "First-party Python client for the SkyPortal API"
readme = "README.md"
authors = [{ name = "Leo Conforti", email = "leo@leoconforti.us" }]
license = "BSD-3-Clause"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Every package releases in lockstep at one version, so the sibling pin is
# exact; knope bumps it together with the versions (see knope.toml).
dependencies = ["httpx>=0.27", "pydantic>=2", "skyportal-py-models==0.4.0"]
requires-python = ">=3.11"

[project.urls]
source = "https://github.com/skyportal/skyportal-monorepo"

# Stripped at build time; the published wheel carries the `==` requirement above.
[tool.uv.sources]
skyportal-py-models = { workspace = true }

[tool.uv.build-backend]
module-name = "skyportal_py"
module-root = ""
