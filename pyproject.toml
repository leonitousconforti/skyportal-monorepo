# Workspace root: not a package itself, it exists so `uv sync` installs every
# Python package under packages/ editable into one shared virtualenv, and so the
# lint/type/test tooling is configured once for all of them.
[project]
name = "skyportal-monorepo"
version = "0"
requires-python = ">=3.11"
dependencies = ["skyportal-py", "skyportal-py-models"]

[dependency-groups]
dev = ["ruff", "towncrier", "ty"]
test = ["pytest", "respx"]

[tool.uv]
package = false
default-groups = ["dev", "test"]
# Listed explicitly rather than globbed: packages/ also holds the TypeScript
# packages, and a `packages/*` glob errors on any member without a pyproject.
workspace = { members = ["packages/api-models-py", "packages/client-py"] }

[tool.uv.sources]
skyportal-py = { workspace = true }
skyportal-py-models = { workspace = true }

[tool.ty.src]
include = ["packages/api-models-py", "packages/client-py", "tools"]

[tool.ruff]
extend-exclude = ["node_modules"]

[tool.ruff.lint]
extend-select = [
    "A",    # shadowing Python builtins
    "ANN",  # require type annotations
    "ARG",  # unused function arguments
    "B",    # bugbear: likely bugs and design problems
    "C4",   # unnecessary comprehensions and generator calls
    "D",    # docstring presence and style
    "DTZ",  # naive (timezone-unaware) datetimes
    "EM",   # string literals directly in raise statements
    "ERA",  # commented-out code
    "EXE",  # shebang and executable-bit consistency
    "FA",   # missing `from __future__ import annotations`
    "FBT",  # boolean positional arguments ("boolean traps")
    "FURB", # modernization refactors
    "I",    # import sorting
    "ICN",  # conventional import aliases (np, pd, ...)
    "INP",  # missing __init__.py in package directories
    "N",    # PEP 8 naming conventions
    "PERF", # performance anti-patterns
    "PIE",  # misc lints
    "PL",   # pylint
    "PT",   # pytest style
    "PTH",  # os.path calls that should use pathlib
    "RET",  # return statement style
    "RUF",  # ruff-specific rules
    "S",    # security checks
    "SIM",  # simplifiable code
    "SLF",  # private member access on other objects
    "T20",  # stray print statements
    "TID",  # tidy imports
    "TRY",  # exception handling style
    "UP",   # outdated syntax for the minimum Python version
    "W",    # whitespace and deprecation warnings
]

[tool.ruff.lint.isort]
known-first-party = ["skyportal_py", "skyportal_py_models"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001", "PLR2004", "S101", "S106"]
"tools/**" = ["INP001", "T201"]

[tool.coverage.run]
omit = ["*/conftest.py", "*/tests/*"]

# One changelog for every Python package published to PyPI from packages/. They
# share a version and a `pypi-v*` tag, so a per-package changelog would just
# fragment the same release notes. The TypeScript packages use changesets.
[tool.towncrier]
directory = "changes.d"
filename = "CHANGES.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/skyportal/skyportal-monorepo/pull/{issue})"
ignore = ["README.md"]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Other changes"
showcontent = true
