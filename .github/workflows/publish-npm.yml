name: Upload npm Packages

# Triggered by the GitHub release knope publishes (see release.yml).
on:
  release:
    types: [published]

permissions: {}

jobs:
  deploy:
    # Disabled until the release pipeline is switched on (see docs/RELEASING.md).
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Check the tag matches the committed version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          got=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/client-py/pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$got" != "$TAG" ]; then echo "::error::packages are at $got, tag is $TAG"; exit 1; fi

      - run: nix develop -c pnpm install --frozen-lockfile
      - run: nix develop -c pnpm build
      # `pnpm publish` applies each package's publishConfig (dist/ exports).
      - run: nix develop -c pnpm -r publish --access public --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"
