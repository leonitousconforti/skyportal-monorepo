name: Release

# knope owns versions, the changelog, tags and GitHub releases for every
# package in the repository. See RELEASING.md.
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  # A release commit landed on main: tag it and publish the GitHub release,
  # which triggers the PyPI and npm uploads.
  release:
    # Disabled until the release pipeline is switched on (see RELEASING.md):
    # drop the `false &&` to enable.
    if: "false && startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix develop -c knope release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Anything else landed on main: fold pending change files into the release
  # pull request (no-op when there are none).
  prepare-release:
    # Disabled until the release pipeline is switched on (see RELEASING.md):
    # drop the `false &&` to enable.
    if: "false && !startsWith(github.event.head_commit.message, 'chore: release ')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ secrets.KNOPE_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Exit early when there is nothing to release
        id: pending
        run: |
          if ls .changeset/*.md >/dev/null 2>&1; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nix develop -c knope prepare-release
        env:
          GITHUB_TOKEN: ${{ secrets.KNOPE_TOKEN }}
