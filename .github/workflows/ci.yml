name: CI

# Everything CI knows how to do is a flake check: Python lint/types/tests on
# every supported interpreter, the TypeScript typecheck/lint/build/tests, the
# codegen freshness check and the schema-parity comparison. Run the same thing
# locally with `nix flake check`.
on:
  push:
    # Renovate uses `automergeType: branch`, pushing straight to renovate/**
    # without opening a PR, so CI has to run on those branches for Renovate to
    # have a branch status to gate the automerge on.
    branches: [main, "renovate/**"]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --keep-going --print-build-logs

  # Every pull request documents its change for the release notes, or says
  # explicitly that it has none.
  change-file:
    if: >-
      ${{ github.event_name == 'pull_request'
        && github.event.pull_request.user.login != 'renovate[bot]'
        && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - run: |
          if ! git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" | grep -q '^\.changeset/.*\.md$'; then
            echo "::error::Add a change file in .changeset/ (nix develop -c knope document-change) or label the PR skip-changelog."
            exit 1
          fi
