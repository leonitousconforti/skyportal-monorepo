name: CI

# Everything CI knows how to do is a flake check: Python lint/types/tests on
# every supported interpreter and the TypeScript typecheck/lint/build/tests
# including the index.ts codegen freshness check. Run the same thing locally
# with `nix flake check`.
on:
  push:
    # Renovate uses `automergeType: branch`, pushing straight to renovate/**
    # without opening a PR, so CI has to run on those branches for Renovate to
    # have a branch status to gate the automerge on.
    branches: [main, "renovate/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
      - run: nix flake check --keep-going --print-build-logs
