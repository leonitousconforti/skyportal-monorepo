name: Upload Python Packages

# Triggered by the GitHub release knope publishes (see release.yml).
on:
  release:
    types: [published]

permissions: {}

env:
  PACKAGES: skyportal-py-models skyportal-py

jobs:
  deploy:
    # Disabled until the release pipeline is switched on (see docs/RELEASING.md).
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Check the tag matches the committed version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          got=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/client-py/pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$got" != "$TAG" ]; then echo "::error::packages are at $got, tag is $TAG"; exit 1; fi

      - name: Build every package
        run: for pkg in $PACKAGES; do nix develop -c uv build --package "$pkg"; done

      # Uploading together is what lets the client pin the models exactly: both
      # land on PyPI in one call, so neither has to be released first.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
