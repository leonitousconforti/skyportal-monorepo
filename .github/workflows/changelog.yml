name: Changelog

# towncrier fragments are only required for changes to the Python packages; the
# TypeScript packages use changesets, which has its own bot.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
    paths:
      - "packages/api-models-py/**"
      - "packages/client-py/**"
      - "changes.d/**"
      - "pyproject.toml"
      - "uv.lock"

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # Renovate cannot write a towncrier fragment for its own PRs, so exempt them
    # rather than letting this check block dependency merges.
    if: >-
      ${{ github.event.pull_request.user.login != 'renovate[bot]'
        && !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv run --locked --only-group dev towncrier check --compare-with origin/${{ github.base_ref }}
